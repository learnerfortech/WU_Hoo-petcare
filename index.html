<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f4ef"><title>WU HOO · 宠物养护</title><style>
:root{--bg:#f7f4ef;--card:#fff;--text:#292827;--muted:#8b8883;--line:#ece7df;--a:#6f8f72;--a2:#e8efe8;--warm:#f2dfcf;--sh:0 10px 28px #312b2314}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif}.app{max-width:680px;margin:auto;min-height:100vh;padding-bottom:90px}header{padding:24px 18px 10px;display:flex;justify-content:space-between}.brand small{color:var(--muted);letter-spacing:2px;font-size:11px}.brand h1{margin:4px 0;font-size:24px}.icon{width:42px;height:42px;border:0;border-radius:50%;background:var(--card);box-shadow:var(--sh);font-size:20px}main{padding:8px 16px}.hero{padding:20px;background:linear-gradient(135deg,#eef2ea,#fff);border-radius:28px;box-shadow:var(--sh)}.heroTop{display:flex;gap:15px;align-items:center}.avatar{width:84px;height:84px;border-radius:24px;background:#e7dfd5;display:grid;place-items:center;font-size:46px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.hero h2{margin:0 0 5px;font-size:25px}.hero p{margin:0;color:var(--muted);font-size:13px}.edit{margin-left:auto;padding:9px 12px;border:0;border-radius:13px;background:#ffffffcc}.tabs{display:flex;gap:8px;margin-top:15px;overflow:auto}.tab{min-width:92px;flex:1;border:0;border-radius:16px;padding:9px;background:var(--card);color:var(--muted)}.tab.active{background:var(--text);color:#fff}.tab span{display:block;font-size:23px}.head{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.head h3{margin:0;font-size:18px}.head button{border:0;background:var(--a2);color:var(--a);padding:7px 11px;border-radius:12px}.stats,.health{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.health{grid-template-columns:1fr 1fr}.stat,.hc,.task,.record,.store{background:var(--card);border-radius:18px;box-shadow:var(--sh)}.stat{padding:14px 10px}.stat b{display:block;font-size:19px}.stat span,.hc span{color:var(--muted);font-size:12px}.tasks{display:grid;gap:9px}.task{padding:12px;display:flex;align-items:center;gap:10px}.check{width:40px;height:40px;border:0;border-radius:13px;background:var(--a2)}.task.done{opacity:.5}.task.done .tt{text-decoration:line-through}.tc{flex:1}.tt{font-weight:600}.tm{font-size:12px;color:var(--muted);margin-top:3px}.del{border:0;background:none;color:#aaa;font-size:22px}.hc{padding:15px}.hc .ico{font-size:23px}.hc b{display:block;margin:6px 0}.record{padding:12px;display:flex;gap:10px;margin-bottom:8px}.ri{width:38px;height:38px;border-radius:12px;background:var(--warm);display:grid;place-items:center}.rb b,.rb span{display:block}.rb span{font-size:12px;color:var(--muted);margin-top:3px}.store{overflow:hidden;margin-top:8px}.storePic{height:145px;background:linear-gradient(135deg,#d9c8b7,#f3eee7);display:grid;place-items:center;font-size:55px}.storeBody{padding:15px}.storeBody h3{margin:0 0 6px}.storeBody p{font-size:13px;color:var(--muted);line-height:1.6;margin:4px 0}.map{display:inline-block;margin-top:7px;padding:10px 13px;border-radius:13px;background:var(--text);color:#fff;text-decoration:none;font-size:13px}.bottom{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:0;width:min(680px,100%);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#ffffffee;backdrop-filter:blur(15px);display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line)}.nav{border:0;background:none;color:#999;padding:4px;font-size:19px}.nav small{display:block;font-size:10px}.nav.active{color:var(--a)}.overlay{display:none;position:fixed;inset:0;background:#0006;z-index:80;padding:18px;align-items:flex-end}.overlay.show{display:flex}.sheet{background:var(--card);width:100%;max-width:680px;margin:auto;border-radius:25px;padding:18px;max-height:88vh;overflow:auto}.sh{display:flex;justify-content:space-between;align-items:center}.sh h3{margin:0}.close{width:36px;height:36px;border:0;border-radius:50%}.form{display:grid;gap:10px;margin-top:14px}.form input,.form textarea,.form select{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:#faf9f7}.primary,.secondary{padding:12px;border:0;border-radius:13px}.primary{background:var(--text);color:#fff}.secondary{background:var(--a2);color:var(--a)}.toast{position:fixed;z-index:100;left:50%;bottom:95px;transform:translateX(-50%);background:var(--text);color:#fff;padding:9px 14px;border-radius:13px;display:none}.toast.show{display:block}.dark{--bg:#171715;--card:#252522;--text:#f4f1eb;--muted:#aaa79f;--line:#393833;--a2:#29362c;--warm:#49382d}
</style></head><body><div class="app"><header><div class="brand"><small>WU HOO PETCARE</small><h1>我的宠物养护 🐾</h1></div><button class="icon" id="theme">☾</button></header><main><section class="hero"><div class="heroTop"><div class="avatar" id="avatar">🐶</div><div><h2 id="name"></h2><p id="meta"></p></div><button class="edit" id="edit">编辑</button></div><div class="tabs" id="tabs"></div></section><div class="head"><h3>今日概览</h3><span id="date" style="font-size:12px;color:var(--muted)"></span></div><section class="stats"><div class="stat"><b id="done">0/4</b><span>今日养护</span></div><div class="stat"><b id="weight"></b><span>最近体重</span></div><div class="stat"><b>良好</b><span>健康状态</span></div></section><div class="head"><h3>今日养护</h3><button id="addTask">＋ 添加</button></div><section class="tasks" id="tasks"></section><div class="head"><h3>健康档案</h3><button id="addRec">＋ 记录</button></div><section class="health"><div class="hc"><div class="ico">💉</div><b>疫苗</b><span>基础接种已完成</span></div><div class="hc"><div class="ico">🪱</div><b>驱虫</b><span>按周期提醒</span></div><div class="hc"><div class="ico">⚖️</div><b>体重</b><span id="wc"></span></div><div class="hc"><div class="ico">🏥</div><b>就诊</b><span>查看最近记录</span></div></section><div class="head"><h3>最近记录</h3></div><section id="records"></section><div class="head"><h3>WU HOO 宠物店</h3></div><section class="store"><div class="storePic">🐶 🐱 🛁</div><div class="storeBody"><h3>WU HOO 宠物店</h3><p>📍 海淀区曙光花园中路 wuhoo宠物店</p><p>洗护 · 美容 · 日常护理 · 宠物用品</p><a class="map" target="_blank" href="https://uri.amap.com/search?keyword=wuhoo宠物店%20海淀区曙光花园中路">打开地图导航 →</a></div></section></main><nav class="bottom"><button class="nav active" data-p="home">⌂<small>首页</small></button><button class="nav" data-p="pets">🐾<small>宠物</small></button><button class="nav" data-p="health">♡<small>健康</small></button><button class="nav" data-p="diary">✎<small>日记</small></button><button class="nav" data-p="mine">☻<small>我的</small></button></nav></div><div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>
<script>
(()=>{const $=x=>document.getElementById(x),day=()=>new Date().toLocaleDateString("zh-CN",{month:"numeric",day:"numeric"});let pets=[{name:"豆豆",age:"2 岁",sex:"公",breed:"柴犬",emoji:"🐶",weight:"10.8 kg"},{name:"团团",age:"1 岁",sex:"母",breed:"英短",emoji:"🐱",weight:"4.6 kg"},{name:"奶糖",age:"3 岁",sex:"母",breed:"比熊",emoji:"🐩",weight:"6.2 kg"}],tasks=[{name:"早餐",time:"08:00",icon:"🍚",done:false},{name:"喝水检查",time:"10:00",icon:"💧",done:false},{name:"户外散步",time:"18:30",icon:"🐾",done:false},{name:"梳毛",time:"20:00",icon:"🪮",done:false}],records=[],cur=0;try{let s=JSON.parse(localStorage.wuhoo||"null");if(s){pets=s.pets||pets;tasks=s.tasks||tasks;records=s.records||[];cur=s.cur||0;if(s.dark)document.body.classList.add("dark")}}catch(e){}const save=()=>{try{localStorage.wuhoo=JSON.stringify({pets,tasks,records,cur,dark:document.body.classList.contains("dark")})}catch(e){}};function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1400)}function render(){let p=pets[cur];$("name").textContent=p.name;$("meta").textContent=`${p.age} · ${p.sex} · ${p.breed}`;$("avatar").innerHTML=p.photo?`<img src="${p.photo}">`:p.emoji;$("weight").textContent=p.weight;$("wc").textContent=p.weight;$("date").textContent=day();$("tabs").innerHTML=pets.map((x,i)=>`<button class="tab ${i==cur?"active":""}" data-pet="${i}"><span>${x.emoji}</span>${x.name}</button>`).join("");$("tasks").innerHTML=tasks.map((t,i)=>`<div class="task ${t.done?"done":""}"><button class="check" data-check="${i}">${t.done?"✓":t.icon}</button><div class="tc"><div class="tt">${t.name}</div><div class="tm">${t.time}</div></div><button class="del" data-del="${i}">×</button></div>`).join("");$("done").textContent=tasks.filter(x=>x.done).length+"/"+tasks.length;$("records").innerHTML=records.length?records.slice(0,8).map(r=>`<div class="record"><div class="ri">${r.icon||"📝"}</div><div class="rb"><b>${r.title}</b><span>${r.text} · ${r.date}</span></div></div>`).join(""):"<div style='color:var(--muted);font-size:13px;padding:10px 2px'>还没有记录，完成今日养护后会自动生成。</div>";save()}function close(){ $("ov").classList.remove("show")}function sheet(title,body){$("sheet").innerHTML=`<div class="sh"><h3>${title}</h3><button class="close" id="close">×</button></div>${body}`;$("ov").classList.add("show")}function page(p){if(p=="home"){close();return}if(p=="pets")sheet("我的宠物",`<div class="form">${pets.map((x,i)=>`<button class="secondary" data-pick="${i}" style="text-align:left"><b style="font-size:23px">${x.emoji}</b> ${x.name}<br><small>${x.age} · ${x.sex} · ${x.breed} · ${x.weight}</small></button>`).join("")}</div>`);else if(p=="health")sheet("健康管理",`<div class="health" style="margin-top:14px"><div class="hc"><div class="ico">💉</div><b>疫苗</b><span>记录疫苗时间</span></div><div class="hc"><div class="ico">🪱</div><b>驱虫</b><span>设置周期提醒</span></div><div class="hc"><div class="ico">⚖️</div><b>体重</b><span>${pets[cur].weight}</span></div><div class="hc"><div class="ico">🏥</div><b>就诊</b><span>添加看诊记录</span></div></div><button class="primary" id="quick" style="width:100%;margin-top:14px">＋ 添加健康记录</button>`);else if(p=="diary")sheet("宠物日记",`<div class="form"><textarea id="diary" rows="5" placeholder="记录今天和 ${pets[cur].name} 的小故事……"></textarea><button class="primary" id="saveDiary">保存日记</button></div>`);else sheet("我的",`<div class="form"><div class="hc"><b>🏪 WU HOO 宠物店</b><span>海淀区曙光花园中路 wuhoo宠物店</span></div><a class="map" target="_blank" href="https://uri.amap.com/search?keyword=wuhoo宠物店%20海淀区曙光花园中路" style="text-align:center">地图导航</a><div class="hc"><b>📱 添加到主屏幕</b><span>Safari 分享 → 添加到主屏幕，即可像 App 一样使用。</span></div></div>`)}
document.addEventListener("click",e=>{let n=e.target.closest(".nav");if(n){document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));n.classList.add("active");page(n.dataset.p)}let t=e.target.closest(".tab");if(t){cur=+t.dataset.pet;render();toast("已切换到 "+pets[cur].name)}let pick=e.target.closest("[data-pick]");if(pick){cur=+pick.dataset.pick;close();document.querySelector('[data-p="home"]').click();render()}if(e.target.id=="close")close();let c=e.target.closest("[data-check]");if(c){let i=+c.dataset.check;tasks[i].done=!tasks[i].done;if(tasks[i].done)records.unshift({icon:tasks[i].icon,title:tasks[i].name,text:"已完成",date:day()});render()}let d=e.target.closest("[data-del]");if(d){tasks.splice(+d.dataset.del,1);render()}if(e.target.id=="quick"){close();$("addRec").click()}if(e.target.id=="saveDiary"){let v=$("diary").value.trim();if(v){records.unshift({icon:"📖",title:pets[cur].name+"的日记",text:v,date:day()});close();render();toast("日记已保存")}}if(e.target.id=="saveTask"){let n=$("tn").value.trim();if(n){tasks.push({name:n,time:$("tt").value.trim()||"待安排",icon:$("ti").value,done:false});close();render();toast("已添加")}}if(e.target.id=="saveRec"){let n=$("rn").value.trim();if(n){records.unshift({icon:$("ri2").value,title:n,text:$("rt").value.trim()||"已记录",date:day()});close();render();toast("记录已保存")}}if(e.target.id=="savePet"){let p=pets[cur];p.name=$("pn").value.trim()||p.name;p.age=$("pa").value.trim()||p.age;p.sex=$("ps").value.trim()||p.sex;p.breed=$("pb").value.trim()||p.breed;p.weight=$("pw").value.trim()||p.weight;close();render();toast("宠物信息已更新")}if(e.target.id=="photoBtn")$("photo").click()});
$("addTask").onclick=()=>sheet("添加养护事项",`<div class="form"><input id="tn" placeholder="事项，例如：喂食 / 洗澡"><input id="tt" placeholder="时间，例如：18:30"><select id="ti"><option>🐾</option><option>🍚</option><option>💧</option><option>🪮</option><option>💊</option></select><button class="primary" id="saveTask">保存</button></div>`);$("addRec").onclick=()=>sheet("添加健康记录",`<div class="form"><select id="ri2"><option>💉</option><option>🪱</option><option>⚖️</option><option>🏥</option><option>💊</option></select><input id="rn" placeholder="记录标题，例如：完成疫苗"><input id="rt" placeholder="补充说明"><button class="primary" id="saveRec">保存记录</button></div>`);$("edit").onclick=()=>{let p=pets[cur];sheet("编辑 "+p.name,`<div class="form"><input id="pn" value="${p.name}"><input id="pa" value="${p.age}"><input id="ps" value="${p.sex}"><input id="pb" value="${p.breed}"><input id="pw" value="${p.weight}"><input id="photo" type="file" accept="image/*" style="display:none"><button class="secondary" id="photoBtn">📷 更换照片</button><button class="primary" id="savePet">保存</button></div>`)};document.addEventListener("change",e=>{if(e.target.id=="photo"){let f=e.target.files[0];if(f){let r=new FileReader;r.onload=()=>{pets[cur].photo=r.result;render();toast("照片已更新")};r.readAsDataURL(f)}}});$("theme").onclick=()=>{document.body.classList.toggle("dark");$("theme").textContent=document.body.classList.contains("dark")?"☀":"☾";save()};$("ov").onclick=e=>{if(e.target==$("ov"))close()};render()})();
</script></body></html>

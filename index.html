<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ef">
<title>我的宠物养护</title>

<style>
:root{
  --bg:#f7f4ef;
  --card:#ffffff;
  --text:#292929;
  --sub:#8c8c8c;
  --green:#78947e;
  --green-light:#e8f0e9;
  --line:#eeeeee;
  --danger:#d97968;
  --shadow:0 10px 35px rgba(70,60,50,.07);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
}

button,
input,
textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  max-width:900px;
  margin:auto;
  padding:35px 20px 120px;
}

/* 顶部 */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:28px;
}

.brand-small{
  letter-spacing:5px;
  font-size:13px;
  color:var(--sub);
  margin-bottom:8px;
}

h1{
  margin:0;
  font-size:36px;
  line-height:1.2;
  letter-spacing:-1px;
}

.theme-btn{
  width:58px;
  height:58px;
  border-radius:50%;
  background:var(--card);
  box-shadow:var(--shadow);
  font-size:25px;
}

/* 宠物卡 */
.pet-card{
  background:rgba(255,255,255,.78);
  border-radius:36px;
  padding:28px;
  box-shadow:var(--shadow);
  margin-bottom:32px;
}

.pet-main{
  display:flex;
  align-items:center;
  gap:22px;
}

.pet-photo{
  width:150px;
  height:150px;
  border-radius:32px;
  background:#e7dfd4;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:76px;
  flex-shrink:0;
  overflow:hidden;
}

.pet-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.pet-info{
  flex:1;
}

.pet-name{
  font-size:38px;
  font-weight:800;
  margin-bottom:8px;
}

.pet-meta{
  color:var(--sub);
  font-size:18px;
}

.edit-btn{
  background:white;
  color:#4b82dc;
  padding:13px 20px;
  border-radius:22px;
}

/* 宠物切换 */
.pet-switch{
  display:flex;
  gap:14px;
  margin-top:28px;
  overflow-x:auto;
}

.pet-switch::-webkit-scrollbar{
  display:none;
}

.pet-chip{
  min-width:145px;
  padding:18px;
  border-radius:26px;
  background:#fff;
  text-align:center;
  color:var(--sub);
  box-shadow:0 3px 12px rgba(0,0,0,.02);
}

.pet-chip.active{
  background:#292929;
  color:white;
}

.pet-chip .emoji{
  font-size:30px;
  display:block;
  margin-bottom:5px;
}

/* 标题 */
.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:28px 4px 16px;
}

.section-title h2{
  font-size:29px;
  margin:0;
}

.date{
  color:var(--sub);
}

.add-btn{
  background:var(--green-light);
  color:var(--green);
  padding:12px 18px;
  border-radius:20px;
}

/* 数据概览 */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.stat{
  background:white;
  border-radius:28px;
  padding:24px 18px;
  box-shadow:var(--shadow);
}

.stat-number{
  font-size:31px;
  font-weight:800;
}

.stat-label{
  color:var(--sub);
  margin-top:5px;
}

/* 养护 */
.care-list{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.care-item{
  background:white;
  border-radius:28px;
  padding:20px;
  display:flex;
  align-items:center;
  gap:17px;
  box-shadow:var(--shadow);
}

.care-icon{
  width:65px;
  height:65px;
  border-radius:22px;
  background:var(--green-light);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:31px;
  flex-shrink:0;
}

.care-info{
  flex:1;
}

.care-name{
  font-size:21px;
  font-weight:700;
}

.care-time{
  color:var(--sub);
  margin-top:5px;
}

.done-btn{
  width:44px;
  height:44px;
  border-radius:50%;
  background:#f2f2f2;
  color:#aaa;
  font-size:20px;
}

.done-btn.done{
  background:var(--green);
  color:white;
}

.delete-btn{
  background:transparent;
  color:#bbb;
  font-size:26px;
}

/* 店铺 */
.store-card{
  position:relative;
  min-height:230px;
  border-radius:32px;
  overflow:hidden;
  margin-top:15px;
  background:
    linear-gradient(120deg,#4e5c51,#899b8b);
  box-shadow:var(--shadow);
  color:white;
}

.store-card img{
  width:100%;
  height:100%;
  min-height:230px;
  object-fit:cover;
  display:block;
}

.store-overlay{
  position:absolute;
  inset:0;
  padding:25px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  background:linear-gradient(
    transparent 25%,
    rgba(0,0,0,.72)
  );
}

.store-tag{
  display:inline-block;
  width:max-content;
  background:rgba(255,255,255,.2);
  backdrop-filter:blur(8px);
  padding:7px 12px;
  border-radius:14px;
  font-size:13px;
  margin-bottom:8px;
}

.store-title{
  font-size:27px;
  font-weight:800;
}

.store-desc{
  opacity:.9;
  margin-top:5px;
}

.store-btn{
  width:max-content;
  margin-top:14px;
  padding:11px 17px;
  border-radius:18px;
  background:white;
  color:#333;
}

/* 健康 */
.health-card{
  background:white;
  border-radius:30px;
  padding:25px;
  box-shadow:var(--shadow);
}

.health-row{
  display:flex;
  align-items:center;
  gap:15px;
  padding:15px 0;
  border-bottom:1px solid var(--line);
}

.health-row:last-child{
  border-bottom:0;
}

.health-icon{
  font-size:27px;
}

.health-info{
  flex:1;
}

.health-name{
  font-weight:700;
}

.health-value{
  color:var(--sub);
  font-size:14px;
  margin-top:4px;
}

.good{
  color:var(--green);
  font-weight:700;
}

/* 日记 */
.diary{
  background:white;
  border-radius:30px;
  padding:25px;
  box-shadow:var(--shadow);
}

.diary textarea{
  width:100%;
  min-height:150px;
  border:0;
  outline:0;
  resize:vertical;
  color:var(--text);
  background:transparent;
  font-size:17px;
  line-height:1.7;
}

.save-btn{
  background:var(--green);
  color:white;
  padding:13px 22px;
  border-radius:20px;
}

/* 底部导航 */
.bottom-nav{
  position:fixed;
  left:50%;
  bottom:14px;
  transform:translateX(-50%);
  width:min(94%,850px);
  height:76px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(20px);
  border-radius:35px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 8px 35px rgba(0,0,0,.12);
  z-index:20;
}

.nav-item{
  text-align:center;
  color:#999;
  font-size:13px;
  min-width:55px;
}

.nav-icon{
  display:block;
  font-size:24px;
  margin-bottom:3px;
}

.nav-item.active{
  color:var(--green);
}

/* 弹窗 */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.42);
  backdrop-filter:blur(6px);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:50;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(100%,600px);
  background:white;
  border-radius:32px 32px 0 0;
  padding:28px 22px 35px;
  max-height:85vh;
  overflow:auto;
}

.modal-box h3{
  margin:0 0 22px;
  font-size:25px;
}

.form-group{
  margin-bottom:17px;
}

.form-group label{
  display:block;
  color:var(--sub);
  font-size:14px;
  margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  border:1px solid #e5e5e5;
  border-radius:17px;
  padding:14px;
  outline:none;
  background:#fafafa;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:22px;
}

.modal-actions button{
  flex:1;
  padding:15px;
  border-radius:18px;
}

.cancel{
  background:#f1f1f1;
}

.confirm{
  background:var(--green);
  color:white;
}

/* 深色模式 */
body.dark{
  --bg:#151615;
  --card:#222422;
  --text:#f4f4f2;
  --sub:#999d98;
  --green:#91aa97;
  --green-light:#2c3930;
  --line:#333633;
  --shadow:0 10px 35px rgba(0,0,0,.25);
}

body.dark .pet-card,
body.dark .care-item,
body.dark .stat,
body.dark .health-card,
body.dark .diary,
body.dark .pet-chip,
body.dark .theme-btn{
  background:var(--card);
}

body.dark .edit-btn{
  background:#303330;
}

body.dark .bottom-nav{
  background:rgba(35,37,35,.94);
}

body.dark .modal-box{
  background:#222422;
}

body.dark .form-group input,
body.dark .form-group textarea,
body.dark .form-group select{
  background:#191b19;
  color:white;
  border-color:#383b38;
}

/* 手机 */
@media(max-width:600px){

  .app{
    padding:28px 18px 115px;
  }

  h1{
    font-size:34px;
  }

  .pet-card{
    padding:22px;
    border-radius:30px;
  }

  .pet-main{
    gap:15px;
  }

  .pet-photo{
    width:105px;
    height:105px;
    border-radius:25px;
    font-size:55px;
  }

  .pet-name{
    font-size:30px;
  }

  .pet-meta{
    font-size:16px;
  }

  .edit-btn{
    padding:10px 14px;
  }

  .stats{
    gap:10px;
  }

  .stat{
    padding:19px 12px;
    border-radius:24px;
  }

  .stat-number{
    font-size:25px;
  }

  .stat-label{
    font-size:13px;
  }

  .section-title h2{
    font-size:26px;
  }

  .store-card,
  .store-card img{
    min-height:245px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- 顶部 -->
  <header class="header">
    <div>
      <div class="brand-small">WU HOO PETCARE</div>
      <h1>我的宠物养护 🐾</h1>
    </div>

    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">
      🌙
    </button>
  </header>


  <!-- 宠物 -->
  <section class="pet-card">

    <div class="pet-main">

      <div class="pet-photo" id="petPhoto">
        🐶
      </div>

      <div class="pet-info">
        <div class="pet-name" id="petName">豆豆</div>
        <div class="pet-meta" id="petMeta">
          2 岁 · 公 · 柴犬
        </div>
      </div>

      <button class="edit-btn" onclick="openPetModal()">
        编辑
      </button>

    </div>

    <div class="pet-switch" id="petSwitch"></div>

  </section>


  <!-- 今日概览 -->
  <div class="section-title">
    <h2>今日概览</h2>
    <span class="date" id="today"></span>
  </div>

  <section class="stats">

    <div class="stat">
      <div class="stat-number" id="careCount">0/4</div>
      <div class="stat-label">今日养护</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="weight">10.8 kg</div>
      <div class="stat-label">最近体重</div>
    </div>

    <div class="stat">
      <div class="stat-number good">良好</div>
      <div class="stat-label">健康状态</div>
    </div>

  </section>


  <!-- 今日养护 -->
  <div class="section-title">
    <h2>今日养护</h2>
    <button class="add-btn" onclick="openCareModal()">
      ＋ 添加
    </button>
  </div>

  <section class="care-list" id="careList"></section>


  <!-- 店铺 -->
  <div class="section-title">
    <h2>推荐店铺</h2>
  </div>

  <section class="store-card">

    <!--
      如果你有店铺照片：
      把下面 src 换成你的图片地址即可。

      例如：
      src="store.jpg"
    -->

    <img
      src="https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=1200&q=85"
      alt="宠物店"
      onerror="this.style.display='none'"
    >

    <div class="store-overlay">

      <span class="store-tag">
        🐾 宠物友好
      </span>

      <div class="store-title">
        WU HOO 宠物生活馆
      </div>

      <div class="store-desc">
        洗护 · 美容 · 宠物用品 · 健康咨询
      </div>

      <button
        class="store-btn"
        onclick="alert('这里可以放你的店铺地址或联系方式')"
      >
        查看店铺 →
      </button>

    </div>

  </section>


  <!-- 健康 -->
  <div class="section-title">
    <h2>健康档案</h2>
  </div>

  <section class="health-card">

    <div class="health-row">
      <div class="health-icon">⚖️</div>
      <div class="health-info">
        <div class="health-name">体重</div>
        <div class="health-value">最近记录</div>
      </div>
      <strong>10.8 kg</strong>
    </div>

    <div class="health-row">
      <div class="health-icon">💉</div>
      <div class="health-info">
        <div class="health-name">疫苗</div>
        <div class="health-value">疫苗记录</div>
      </div>
      <strong class="good">正常</strong>
    </div>

    <div class="health-row">
      <div class="health-icon">💊</div>
      <div class="health-info">
        <div class="health-name">用药</div>
        <div class="health-value">当前用药</div>
      </div>
      <strong>无</strong>
    </div>

    <div class="health-row">
      <div class="health-icon">❤️</div>
      <div class="health-info">
        <div class="health-name">整体状态</div>
        <div class="health-value">最近健康状况</div>
      </div>
      <strong class="good">良好</strong>
    </div>

  </section>


  <!-- 日记 -->
  <div class="section-title">
    <h2>宠物日记</h2>
  </div>

  <section class="diary">

    <textarea
      id="diaryText"
      placeholder="记录今天和豆豆发生的小故事……"
    ></textarea>

    <button class="save-btn" onclick="saveDiary()">
      保存日记
    </button>

  </section>

</div>


<!-- 底部导航 -->
<nav class="bottom-nav">

  <div class="nav-item active" onclick="scrollToTop()">
    <span class="nav-icon">⌂</span>
    首页
  </div>

  <div class="nav-item" onclick="scrollToPets()">
    <span class="nav-icon">🐾</span>
    宠物
  </div>

  <div class="nav-item" onclick="scrollToHealth()">
    <span class="nav-icon">♡</span>
    健康
  </div>

  <div class="nav-item" onclick="scrollToDiary()">
    <span class="nav-icon">✎</span>
    日记
  </div>

  <div class="nav-item" onclick="alert('WU HOO PETCARE\\n\\n宠物养护助手')">
    <span class="nav-icon">●</span>
    我的
  </div>

</nav>


<!-- 宠物编辑弹窗 -->
<div class="modal" id="petModal">

  <div class="modal-box">

    <h3>编辑宠物</h3>

    <div class="form-group">
      <label>宠物名字</label>
      <input id="petNameInput" placeholder="例如：豆豆">
    </div>

    <div class="form-group">
      <label>年龄</label>
      <input id="petAgeInput" placeholder="例如：2 岁">
    </div>

    <div class="form-group">
      <label>性别</label>
      <select id="petGenderInput">
        <option>公</option>
        <option>母</option>
      </select>
    </div>

    <div class="form-group">
      <label>品种</label>
      <input id="petBreedInput" placeholder="例如：柴犬">
    </div>

    <div class="form-group">
      <label>头像 Emoji</label>
      <input id="petEmojiInput" placeholder="🐶">
    </div>

    <div class="modal-actions">
      <button class="cancel" onclick="closePetModal()">
        取消
      </button>

      <button class="confirm" onclick="savePet()">
        保存
      </button>
    </div>

  </div>

</div>


<!-- 添加养护弹窗 -->
<div class="modal" id="careModal">

  <div class="modal-box">

    <h3>添加养护项目</h3>

    <div class="form-group">
      <label>项目名称</label>
      <input id="careNameInput" placeholder="例如：吃药">
    </div>

    <div class="form-group">
      <label>时间</label>
      <input id="careTimeInput" type="time">
    </div>

    <div class="form-group">
      <label>图标</label>
      <input id="careIconInput" placeholder="💊">
    </div>

    <div class="modal-actions">

      <button
        class="cancel"
        onclick="closeCareModal()"
      >
        取消
      </button>

      <button
        class="confirm"
        onclick="saveCare()"
      >
        添加
      </button>

    </div>

  </div>

</div>


<script>

/* =========================
   数据
========================= */

let pets = JSON.parse(
  localStorage.getItem("wuhoo_pets")
) || [

  {
    id:1,
    name:"豆豆",
    age:"2 岁",
    gender:"公",
    breed:"柴犬",
    emoji:"🐶",
    weight:"10.8 kg"
  },

  {
    id:2,
    name:"团团",
    age:"3 岁",
    gender:"母",
    breed:"狸花猫",
    emoji:"🐱",
    weight:"4.6 kg"
  },

  {
    id:3,
    name:"奶糖",
    age:"1 岁",
    gender:"母",
    breed:"贵宾",
    emoji:"🐩",
    weight:"5.2 kg"
  }

];

let currentPet =
  Number(localStorage.getItem("wuhoo_current_pet")) || 1;


let careData = JSON.parse(
  localStorage.getItem("wuhoo_care")
) || [

  {
    id:1,
    name:"早餐",
    time:"08:00",
    icon:"🍚",
    done:false
  },

  {
    id:2,
    name:"喝水检查",
    time:"10:00",
    icon:"💧",
    done:false
  },

  {
    id:3,
    name:"户外散步",
    time:"18:00",
    icon:"🐾",
    done:false
  },

  {
    id:4,
    name:"晚餐",
    time:"19:00",
    icon:"🍚",
    done:false
  }

];


/* =========================
   初始化
========================= */

function init(){

  updateDate();

  renderPets();

  renderPet();

  renderCare();

  loadDiary();

  if(localStorage.getItem("wuhoo_dark")==="1"){
    document.body.classList.add("dark");
    document.getElementById("themeBtn").innerText="☀️";
  }

}


/* =========================
   日期
========================= */

function updateDate(){

  const d=new Date();

  document.getElementById("today").innerText =
    `${d.getMonth()+1}/${d.getDate()}`;

}


/* =========================
   宠物
========================= */

function renderPets(){

  const box=document.getElementById("petSwitch");

  box.innerHTML="";

  pets.forEach(p=>{

    const div=document.createElement("button");

    div.className =
      "pet-chip " +
      (p.id===currentPet ? "active":"");

    div.innerHTML=`
      <span class="emoji">${p.emoji}</span>
      ${p.name}
    `;

    div.onclick=()=>{

      currentPet=p.id;

      localStorage.setItem(
        "wuhoo_current_pet",
        currentPet
      );

      renderPets();
      renderPet();

    };

    box.appendChild(div);

  });

}


function renderPet(){

  const p=pets.find(
    x=>x.id===currentPet
  );

  if(!p)return;

  document.getElementById("petName")
    .innerText=p.name;

  document.getElementById("petMeta")
    .innerText=
      `${p.age} · ${p.gender} · ${p.breed}`;

  document.getElementById("petPhoto")
    .innerText=p.emoji;

  document.getElementById("weight")
    .innerText=p.weight;

  document.getElementById("diaryText")
    .placeholder=
      `记录今天和${p.name}发生的小故事……`;

}

   宠物编辑
========================= */

function openPetModal(){

  const p=pets.find(
    x=>x.id===currentPet
  );

  document.getElementById("petNameInput").value=p.name;
  document.getElementById("petAgeInput").value=p.age;
  document.getElementById("petGenderInput").value=p.gender;
  document.getElementById("petBreedInput").value=p.breed;
  document.getElementById("petEmojiInput").value=p.emoji;

  document
    .getElementById("petModal")
    .classList.add("show");

}


function closePetModal(){

  document
    .getElementById("petModal")
    .classList.remove("show");

}


function savePet(){

  const p=pets.find(
    x=>x.id===currentPet
  );

  p.name=
    document.getElementById("petNameInput").value
    || "宠物";

  p.age=
    document.getElementById("petAgeInput").value
    || "1 岁";

  p.gender=
    document.getElementById("petGenderInput").value;

  p.breed=
    document.getElementById("petBreedInput").value
    || "宠物";

  p.emoji=
    document.getElementById("petEmojiInput").value
    || "🐶";

  localStorage.setItem(

  );

  renderPets();
  renderPet();

  closePetModal();

}


/* =========================
   养护
========================= */

function renderCare(){

  const list=document.getElementById("careList");

  list.innerHTML="";

  let done=0;

  careData.forEach(item=>{

    if(item.done)done++;

    const div=document.createElement("div");

    div.className="care-item";

    div.innerHTML=`

      <div class="care-icon">
        ${item.icon}
      </div>

      <div class="care-info">

        <div class="care-name">
          ${item.name}
        </div>

        <div class="care-time">
          ${item.time}
        </div>

      </div>

      <button
        class="done-btn ${item.done?'done':''}"
        onclick="toggleCare(${item.id})"
      >
        ${item.done?'✓':'○'}
      </button>

      <button
        class="delete-btn"
        onclick="deleteCare(${item.id})"
      >
        ×
      </button>

    `;

    list.appendChild(div);

  });


  document.getElementById("careCount")
    .innerText=
      `${done}/${careData.length}`;

}


function toggleCare(id){

  const item=careData.find(
    x=>x.id===id
  );

  item.done=!item.done;

  localStorage.setItem(
    "wuhoo_care",
    JSON.stringify(careData)
  );

  renderCare();

}


function deleteCare(id){

  careData=
    careData.filter(
      x=>x.id!==id
    );

  localStorage.setItem(
    "wuhoo_care",
    JSON.stringify(careData)
  );

  renderCare();

}


/* =========================
   添加养护
========================= */

function openCareModal(){

  document
    .getElementById("careModal")
    .classList.add("show");

}


function closeCareModal(){

  document
    .getElementById("careModal")
    .classList.remove("show");

}


function saveCare(){

  const name=
    document.getElementById("careNameInput").value;

  const time=
    document.getElementById("careTimeInput").value
    || "未设置";

  const icon=
    document.getElementById("careIconInput").value
    || "🐾";

  if(!name){

    alert("请输入养护项目名称");

    return;

  }

  careData.push({

    id:Date.now(),

    name:name,

    time:time,

    icon:icon,

    done:false

  });

  localStorage.setItem(
    "wuhoo_care",
    JSON.stringify(careData)
  );

  document.getElementById("careNameInput").value="";
  document.getElementById("careTimeInput").value="";
  document.getElementById("careIconInput").value="";

  closeCareModal();

  renderCare();

}

   日记
========================= */

function diaryKey(){

  return "wuhoo_diary_"+currentPet;

}


function saveDiary(){

  const text=
    document.getElementById("diaryText").value;

    diaryKey(),

function loadDiary(){

========================= */

function toggleTheme(){

  document.body.classList.toggle("dark");

  const dark=
    document.body.classList.contains("dark");
